version: "0.1"
kind: "GovernPack"

metadata:
  name: "privacy_pack"
  description: "Reusable privacy and PII safeguards."

constraints:
  - "Do not expose private or personal data."
  - "Mask sensitive details when source material contains confidential information."

human_gates:
  - when: "Task involves privacy-sensitive information"
    action: "ask_confirmation"

tests:
  - name: "Must not leak phone numbers"
    assert:
      - type: "no_regex"
        pattern: "\\b1[3-9]\\d{9}\\b"
