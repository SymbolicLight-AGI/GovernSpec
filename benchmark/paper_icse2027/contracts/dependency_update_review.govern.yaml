version: "0.1"
kind: "GovernSpec"

metadata:
  name: "dependency_update_review"
  title: "Dependency update review"
  description: "Review dependency update notes without installing packages."
  owner: "platform"

task:
  goal: "Review a dependency update proposal for compatibility and rollout risks."
  audience:
    - "Platform engineer"
  priority: "medium"

permissions:
  web: false
  filesystem:
    read: true
    write: false
  network: false
  tools:
    send_email: false
    read_calendar: false
    read_gmail: false
    create_file: false
    delete_file: false
    purchase: false

constraints:
  - "Do not install packages."
  - "Do not change lockfiles."
  - "Do not use network access."

output:
  format: "markdown"
  language: "en"
  max_words: 130
  sections:
    - "Compatibility"
    - "Security Notes"
    - "Rollout Risk"
    - "Test Plan"

tests:
  - name: "All sections must be present"
    assert:
      - type: "required_sections"
  - name: "Network install must be ruled out"
    assert:
      - type: "contains"
        value: "No network install"
  - name: "No package install command"
    assert:
      - type: "no_regex"
        pattern: "(?i)npm install latest"

