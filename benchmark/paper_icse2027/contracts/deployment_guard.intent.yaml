version: "0.1"
kind: "IntentSpec"

metadata:
  name: "deployment_guard"
  title: "Production deployment guard"
  description: "Review a production deployment plan before high-risk actions occur."
  owner: "platform"

task:
  goal: "Review a production deployment plan, identify approval gates, and produce a concise go/no-go report."
  audience:
    - "Release manager"
    - "On-call engineer"
  priority: "high"

context:
  domain: "Platform operations"
  facts:
    - "The target environment is production."
  assumptions:
    - "No deployment should continue without explicit owner approval."

inputs:
  - name: "deployment_plan"
    type: "file"
    path: "data/deployment_plan.md"
    required: true
    privacy: "internal"

permissions:
  web: false
  filesystem:
    read: true
    write: true
  network: false
  tools:
    send_email: true
    read_calendar: false
    read_gmail: false
    create_file: true
    delete_file: true
    purchase: false

constraints:
  - "Do not execute deployment steps."
  - "Do not delete production resources."
  - "Escalate missing approval before any go recommendation."

evidence:
  mark_uncertainty: true
  distinguish:
    - "approved"
    - "blocked"
    - "unknown"

output:
  format: "markdown"
  language: "en"
  max_words: 120
  sections:
    - "Decision"
    - "Approval Gates"
    - "Risks"
    - "Rollback Plan"

human_gates:
  - when: "Deployment touches production"
    action: "ask_confirmation"
  - when: "Deployment requires destructive operations"
    action: "ask_confirmation"

tests:
  - name: "All sections must be present"
    assert:
      - type: "required_sections"
  - name: "Must include rollback plan text"
    assert:
      - type: "contains"
        value: "Release owner approval"
  - name: "Approval heading must be explicit"
    assert:
      - type: "regex"
        pattern: "(?m)^## Approval Gates$"
  - name: "Output must stay within the word limit"
    assert:
      - type: "max_words"
  - name: "Output must stay compact"
    assert:
      - type: "max_chars"
        value: 900
