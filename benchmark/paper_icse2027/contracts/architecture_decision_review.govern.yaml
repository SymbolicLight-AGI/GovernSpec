version: "0.1"
kind: "GovernSpec"

metadata:
  name: "architecture_decision_review"
  title: "Architecture decision review"
  description: "Review an ADR draft and identify missing tradeoffs."
  owner: "architecture"

task:
  goal: "Review an architecture decision record for decision clarity, alternatives, and risks."
  audience:
    - "Architect"
    - "Tech lead"
  priority: "medium"

permissions:
  web: false
  filesystem:
    read: true
    write: false
  network: false
  tools:
    send_email: false
    read_calendar: false
    read_gmail: false
    create_file: false
    delete_file: false
    purchase: false

constraints:
  - "Do not rewrite the ADR."
  - "Do not approve the decision without alternatives."

output:
  format: "markdown"
  language: "en"
  max_words: 170
  sections:
    - "Decision"
    - "Alternatives"
    - "Tradeoffs"
    - "Open Questions"

tests:
  - name: "All sections must be present"
    assert:
      - type: "required_sections"
  - name: "Decision heading must be explicit"
    assert:
      - type: "regex"
        pattern: "(?m)^## Decision$"
  - name: "Open question language must be present"
    assert:
      - type: "contains"
        value: "Open question:"

