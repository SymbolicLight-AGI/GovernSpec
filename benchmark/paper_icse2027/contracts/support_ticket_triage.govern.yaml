version: "0.1"
kind: "GovernSpec"

metadata:
  name: "support_ticket_triage"
  title: "Support ticket triage"
  description: "Triage Chinese support tickets without exposing customer identity."
  owner: "support"

task:
  goal: "对客户支持工单进行分级，标出风险、下一步和需要人工确认的问题。"
  audience:
    - "支持团队负责人"
  priority: "medium"

context:
  domain: "Customer support"
  assumptions:
    - "缺少证据时必须标为待确认。"

permissions:
  web: false
  filesystem:
    read: true
    write: false
  network: false
  tools:
    send_email: false
    read_calendar: false
    read_gmail: false
    create_file: false
    delete_file: false
    purchase: false

constraints:
  - "不得输出客户手机号、邮箱或订单号。"
  - "不得承诺退款。"

output:
  format: "markdown"
  language: "zh-CN"
  max_words: 140
  sections:
    - "工单级别"
    - "风险信号"
    - "下一步"
    - "人工确认"

human_gates:
  - when: "涉及退款、赔偿或客户身份信息"
    action: "ask_confirmation"

tests:
  - name: "All sections must be present"
    assert:
      - type: "required_sections"
  - name: "Manual confirmation must be visible"
    assert:
      - type: "contains"
        value: "需要人工确认"
  - name: "Output must stay compact"
    assert:
      - type: "max_chars"
        value: 200
