version: "0.1"
kind: "GovernPack"

metadata:
  name: "no_network_pack"
  description: "Reusable pack that disables external network access."

permissions:
  web: false
  filesystem:
    read: true
    write: false
  network: false
  tools:
    send_email: false
    read_calendar: false
    read_gmail: false
    create_file: false
    delete_file: false
    purchase: false
