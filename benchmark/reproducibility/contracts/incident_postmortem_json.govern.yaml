version: "0.1"
kind: "GovernSpec"

metadata:
  name: "incident_postmortem_json"
  title: "Incident postmortem JSON"
  description: "Produce a structured postmortem summary."
  owner: "sre"

task:
  goal: "Generate a postmortem payload with incident id, impact, contributing factors, and actions."
  audience:
    - "SRE dashboard"
  priority: "high"

permissions:
  web: false
  filesystem:
    read: true
    write: false
  network: false
  tools:
    send_email: false
    read_calendar: false
    read_gmail: false
    create_file: false
    delete_file: false
    purchase: false

constraints:
  - "Do not expose customer identifiers."

output:
  format: "json"
  schema:
    type: object
    additionalProperties: false
    required:
      - incident_id
      - impact
      - contributing_factors
      - actions
    properties:
      incident_id:
        type: string
      impact:
        type: string
      contributing_factors:
        type: array
        minItems: 1
        items:
          type: string
      actions:
        type: array
        minItems: 2
        items:
          type: string

tests:
  - name: "JSON must match schema"
    assert:
      - type: "json_schema"
  - name: "At least one contributing factor is required"
    assert:
      - type: "json_array_min_items"
        path: "$.contributing_factors"
        value: 1




