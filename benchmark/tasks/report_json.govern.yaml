version: "0.1"
kind: "GovernSpec"

metadata:
  name: "report_json"
  title: "Benchmark strict JSON output"
  description: "Benchmark JSON schema compliance."
  owner: "benchmark"

task:
  goal: "Generate a strict JSON report."
  audience:
    - "Automation"
  priority: "high"

context:
  domain: "Operations"
  facts: []
  assumptions: []
  glossary: {}

inputs: []

permissions:
  web: false
  filesystem:
    read: true
    write: false
  network: false
  tools:
    send_email: false
    read_calendar: false
    read_gmail: false
    create_file: false
    delete_file: false
    purchase: false

constraints:
  - "Do not fabricate facts."

evidence:
  require_sources: false
  mark_uncertainty: true
  distinguish:
    - "fact"

output:
  format: "json"
  schema:
    type: object
    additionalProperties: false
    required:
      - verdict
      - risks
    properties:
      verdict:
        type: string
      risks:
        type: array
        minItems: 1
        items:
          type: string

quality:
  tone: []
  must_include: []
  must_avoid: []

human_gates: []

tests:
  - name: "JSON must match schema"
    assert:
      - type: "json_schema"
