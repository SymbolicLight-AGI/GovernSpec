version: "0.1"
kind: "GovernSpec"

metadata:
  name: "market_analysis"
  title: "新能源汽车市场分析"
  description: "生成一份给管理层的市场分析摘要。"
  owner: "strategy"

task:
  goal: "总结市场规模、竞争格局、风险与战略建议。"
  audience:
    - "Management"
  priority: "medium"

context:
  domain: "Electric vehicles"
  facts: []
  assumptions:
    - "When live market data is unavailable, mark uncertain claims clearly."
  glossary: {}

inputs: []

permissions:
  web: true
  filesystem:
    read: true
    write: false
  network: true
  tools:
    send_email: false
    read_calendar: false
    read_gmail: false
    create_file: false
    delete_file: false
    purchase: false

constraints:
  - "Do not fabricate market data."
  - "Mark unsupported claims as inference."

evidence:
  require_sources: true
  mark_uncertainty: true
  distinguish:
    - "fact"
    - "inference"
    - "recommendation"

output:
  format: "markdown"
  language: "zh-CN"
  max_words: 1000
  sections:
    - "核心结论"
    - "市场规模"
    - "竞争格局"
    - "政策与风险"
    - "战略建议"
    - "依据与不确定性"

quality:
  tone:
    - "concise"
    - "executive"
  must_include: []
  must_avoid: []

human_gates:
  - when: "需要访问外部网络"
    action: "ask_confirmation"

tests:
  - name: "All sections must be present"
    assert:
      - type: "required_sections"
  - name: "Output must stay within the word limit"
    assert:
      - type: "max_words"
