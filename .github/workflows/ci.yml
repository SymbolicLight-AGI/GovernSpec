name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

      - name: Build package
        run: python -m build

      - name: Check dist metadata
        run: twine check dist/*

  node-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build TypeScript wrapper
        working-directory: packages/governspec-ts
        run: |
          npm install
          npm run build

      - name: Install and build VS Code extension
        working-directory: packages/governspec-vscode
        run: |
          npm install
          npm run build
